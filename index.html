            <button id="singleGenBtn" class="action-btn secondary-btn" disabled>✨ 单张</button>
            <button id="batchGenBtn" class="action-btn primary-btn" disabled>📦 批量</button>
            <button id="clearBtn" class="action-btn secondary-btn">清空</button>
            <button id="galleryBtn" class="action-btn gallery-btn">🖼️ 查看图库</button>
        </div>

        <div class="preview-area">
            <canvas id="previewCanvas" width="270" height="420"></canvas>
        </div>

        <div class="progress-wrap" id="progressWrap"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-text" id="statusText">选择限定标，上传图片开始</div>

        <div class="image-grid" id="imageGrid"></div>
    </div>

    <script>
const BADGE_DATA = {
    'badge_01': { name: '限定标_01', data: '徽章1/badge_01.webp' },
    'badge_02': { name: '限定标_02', data: '徽章1/badge_02.webp' },
    'badge_03': { name: '限定标_03', data: '徽章1/badge_03.webp' },
    'badge_04': { name: '限定标_04', data: '徽章1/badge_04.webp' },
    'badge_05': { name: '限定标_05', data: '徽章1/badge_05.webp' },
    'badge_06': { name: '限定标_06', data: '徽章1/badge_06.webp' },
    'badge_07': { name: '限定标_07', data: '徽章1/badge_07.webp' },
    'badge_08': { name: '限定标_08', data: '徽章1/badge_08.webp' },
    'badge_09': { name: '限定标_09', data: '徽章1/badge_09.webp' },
    'badge_10': { name: '限定标_10', data: '徽章1/badge_10.webp' },
    'badge_11': { name: '限定标_11', data: '徽章2/badge_11.webp' },
    'badge_12': { name: '限定标_12', data: '徽章2/badge_12.webp' },
    'badge_13': { name: '限定标_13', data: '徽章2/badge_13.webp' },
    'badge_14': { name: '限定标_14', data: '徽章2/badge_14.webp' },
    'badge_15': { name: '限定标_15', data: '徽章2/badge_15.webp' },
    'badge_16': { name: '限定标_16', data: '徽章2/badge_16.webp' },
    'badge_17': { name: '限定标_17', data: '徽章2/badge_17.webp' },
    'badge_18': { name: '限定标_18', data: '徽章2/badge_18.webp' },
    'badge_19': { name: '限定标_19', data: '徽章2/badge_19.webp' },
    'badge_20': { name: '限定标_20', data: '徽章2/badge_20.webp' },
    'badge_21': { name: '限定标_21', data: '徽章3/badge_21.webp' },
    'badge_22': { name: '限定标_22', data: '徽章3/badge_22.webp' },
    'badge_23': { name: '限定标_23', data: '徽章3/badge_23.webp' },
    'badge_24': { name: '限定标_24', data: '徽章3/badge_24.webp' },
    'badge_25': { name: '限定标_25', data: '徽章3/badge_25.webp' },
    'badge_28': { name: '限定标_28', data: '徽章3/badge_28.webp' },
    'badge_29': { name: '限定标_29', data: '徽章3/badge_29.webp' },
    'badge_30': { name: '限定标_30', data: '徽章3/badge_30.webp' },
    'badge_31': { name: '限定标_31', data: '徽章3/badge_31.webp' },
};


(function(){
    const W = 450, H = 700, R = W/H, TARGET_KB_MIN = 200, TARGET_KB_MAX = 500;
    let list = [], sel = null, proc = false, badge = 'none', imgs = {};
    const $ = id => document.getElementById(id);
    const canvas = $('previewCanvas'), ctx = canvas.getContext('2d');
    
    function loadBadges() {
        Object.keys(BADGE_DATA).forEach(k => {
            const i = new Image();
            i.onload = () => {
                imgs[k] = i;
                const d = document.createElement('div');
                d.className = 'badge-item'; d.dataset.badge = k;
                d.innerHTML = `<img class="badge-thumb" src="${BADGE_DATA[k].data}"><div class="badge-name">${BADGE_DATA[k].name}</div>`;
                $('badgeGrid').appendChild(d);
            };
            i.src = BADGE_DATA[k].data;
        });
    }

    function loadImg(f) {
        return new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res({img: i, url: URL.createObjectURL(f)});
            i.onerror = rej;
            i.src = URL.createObjectURL(f);
        });
    }

    function draw(c, img, w, h, bid) {
        const x = c.getContext('2d');
        c.width = w; c.height = h;
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        const r = img.width / img.height;
        if (r > R) { sw = img.height * R; sx = (img.width - sw) / 2; }
        else { sh = img.width / R; sy = (img.height - sh) / 2; }
        x.clearRect(0, 0, w, h);
        x.imageSmoothingEnabled = true;
        x.imageSmoothingQuality = 'high';
        x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        
        if (bid && bid !== 'none' && imgs[bid]) {
            const bi = imgs[bid];
            const bw = w * 0.85;
            const bh = bw * (bi.height / bi.width);
            const bx = (w - bw) / 2;
            const by = (h / 2) + (h * 0.05);
            x.drawImage(bi, bx, by, bw, bh);
        }
    }

    function noise(d, s) {
        const a = new Uint8ClampedArray(d.data);
        for (let i = 0; i < a.length; i += 4) {
            if (Math.random() < 0.5) {
                const dl = (Math.random() - 0.5) * s;
                a[i] = Math.min(255, Math.max(0, a[i] + dl));
                a[i+1] = Math.min(255, Math.max(0, a[i+1] + dl * 0.75));
                a[i+2] = Math.min(255, Math.max(0, a[i+2] + dl * 0.8));
            }
        }
        return new ImageData(a, d.width, d.height);
    }

    function quant(d, st) {
        const a = new Uint8ClampedArray(d.data);
        for (let i = 0; i < a.length; i += 4) {
            a[i] = Math.round(a[i] / st) * st;
            a[i+1] = Math.round(a[i+1] / st) * st;
            a[i+2] = Math.round(a[i+2] / st) * st;
        }
        return new ImageData(a, d.width, d.height);
    }

    async function toBlob(d) {
        return new Promise(r => {
            const c = document.createElement('canvas');
            c.width = d.width; c.height = d.height;
            c.getContext('2d').putImageData(d, 0, 0);
            c.toBlob(r, 'image/png', 1.0);
        });
    }

    // 在PNG文件中添加填充数据，使其精确达到目标大小
    function padPngToSize(blob, targetBytes) {
        return new Promise(resolve => {
            if (blob.size >= targetBytes) {
                resolve(blob);
                return;
            }
            const needed = targetBytes - blob.size;
            // PNG tEXt chunk格式: 长度(4) + "tEXt"(4) + keyword + \0 + text + CRC(4)
            // chunk总大小 = 4(长度) + 4(类型) + 数据长度 + 4(CRC)
            const keyword = 'Comment';
            const headerSize = 4 + 4 + keyword.length + 1 + 4; // 长度+类型+keyword+null+CRC
            const textSize = needed - headerSize;
            if (textSize < 0) {
                resolve(blob);
                return;
            }
            const text = 'X'.repeat(textSize);
            const chunkData = new TextEncoder().encode(keyword + '\x00' + text);
            const chunkType = new TextEncoder().encode('tEXt');
            
            const reader = new FileReader();
            reader.onload = () => {
                const original = new Uint8Array(reader.result);
                // PNG签名(8) + IHDR(25) + ... + IDAT + IEND(12)
                // 在IEND前插入tEXt chunk
                const iendOffset = original.length - 12; // IEND是最后12字节
                const lengthBytes = new Uint8Array(4);
                const view = new DataView(lengthBytes.buffer);
                view.setUint32(0, chunkData.length, false);
                
                // 计算CRC
                const crcData = new Uint8Array(chunkType.length + chunkData.length);
                crcData.set(chunkType, 0);
                crcData.set(chunkData, chunkType.length);
                const crc = crc32(crcData);
                const crcBytes = new Uint8Array(4);
                const crcView = new DataView(crcBytes.buffer);
                crcView.setUint32(0, crc, false);
                
                const result = new Uint8Array(original.length + 4 + 4 + chunkData.length + 4);
                result.set(original.slice(0, iendOffset), 0);
                let pos = iendOffset;
                result.set(lengthBytes, pos); pos += 4;
                result.set(chunkType, pos); pos += 4;
                result.set(chunkData, pos); pos += chunkData.length;
                result.set(crcBytes, pos); pos += 4;
                result.set(original.slice(iendOffset), pos);
                
                resolve(new Blob([result], {type: 'image/png'}));
            };
            reader.readAsArrayBuffer(blob);
        });
    }

    // CRC32计算
    function crc32(data) {
        let crc = 0xFFFFFFFF;
        const table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            let c = i;
            for (let j = 0; j < 8; j++) {
                c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            }
            table[i] = c;
        }
        for (let i = 0; i < data.length; i++) {
            crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    async function adjust(c) {
        const minBytes = TARGET_KB_MIN * 1024;
        const maxBytes = TARGET_KB_MAX * 1024;
        const t = document.createElement('canvas');
        t.width = c.width; t.height = c.height;
        const x = t.getContext('2d');
        x.drawImage(c, 0, 0);
        let d = x.getImageData(0, 0, t.width, t.height);
        let b = await toBlob(d);
        
        // 如果图片太小，添加噪点增大
        if (b.size < minBytes) {
            for (let s = 2; s <= 30; s += 3) {
                const nb = await toBlob(noise(d, s));
                if (nb.size >= minBytes && nb.size <= maxBytes) {
                    b = nb;
                    break;
                }
                b = nb;
            }
        }
        
        // 如果图片太大，量化减小
        if (b.size > maxBytes) {
            for (let st = 2; st <= 20; st += 2) {
                const nb = await toBlob(quant(d, st));
                if (nb.size <= maxBytes) {
                    b = nb;
                    break;
                }
            }
            if (b.size > maxBytes) {
                b = await toBlob(quant(d, 12));
            }
        }
        
        return b;
    }

    async function gen(img, bid) {
        const c = document.createElement('canvas');
        draw(c, img, W, H, bid);
        const blob = await adjust(c);
        try {
            const fileName = 'poster_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.png';
            await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, blob);
        } catch(e) { console.log('上传跳过', e); }
        return blob;
    }

    function preview() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 270, 420);
        if (!sel) {
            ctx.fillStyle = '#666';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('预览', 135, 200);
            return;
        }
        const o = list.find(i => i.id === sel);
        if (o) draw(canvas, o.img, 270, 420, badge);
    }

    function render() {
        const g = $('imageGrid');
        g.innerHTML = list.length ? '' : '<div style="grid-column:1/-1;text-align:center;padding:25px;color:#666;font-size:0.8rem;">暂无图片</div>';
        $('singleGenBtn').disabled = !sel || proc;
        $('batchGenBtn').disabled = !list.length || proc;
        list.forEach(it => {
            const c = document.createElement('div');
            c.className = 'img-card' + (it.id === sel ? ' selected' : '');
            c.innerHTML = `<img class="img-thumb" src="${it.url}"><div class="img-name">${it.name}</div><div class="remove-btn">×</div>`;
            c.onclick = e => {
                if (e.target.classList.contains('remove-btn')) {
                    URL.revokeObjectURL(it.url);
                    list = list.filter(i => i.id !== it.id);
                    if (sel === it.id) sel = list[0]?.id || null;
                    render(); preview();
                } else { sel = it.id; render(); preview(); }
            };
            g.appendChild(c);
        });
    }

    $('badgeGrid').onclick = e => {
        const it = e.target.closest('.badge-item');
        if (!it) return;
        if (it.dataset.badge === badge) {
            badge = 'none';
            $('badgeGrid').querySelector('[data-badge="none"]').classList.add('selected');
            it.classList.remove('selected');
        } else {
            $('badgeGrid').querySelectorAll('.badge-item').forEach(el => el.classList.remove('selected'));
            it.classList.add('selected');
            badge = it.dataset.badge;
        }
        preview();
        $('statusText').innerText = badge === 'none' ? '已取消' : `已选：${BADGE_DATA[badge]?.name}`;
    };

    $('uploadArea').onclick = () => $('fileInput').click();
    $('fileInput').onchange = async e => {
        const fs = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        for (const f of fs) {
            try {
                const {img, url} = await loadImg(f);
                list.push({id: Date.now() + Math.random().toString(36).slice(2), name: f.name, img, url});
                if (!sel) sel = list[list.length - 1].id;
            } catch (err) {}
        }
        render(); preview();
        $('statusText').innerText = `已加载${fs.length}张`;
        e.target.value = '';
    };

    $('clearBtn').onclick = () => {
        list.forEach(i => URL.revokeObjectURL(i.url));
        list = []; sel = null;
        render(); preview();
        $('statusText').innerText = '已清空';
    };

    $('singleGenBtn').onclick = async () => {
        if (!sel || proc) return;
        const o = list.find(i => i.id === sel);
        if (!o) return;
        proc = true; $('singleGenBtn').disabled = $('batchGenBtn').disabled = true;
        $('statusText').innerText = '生成中...';
        try {
            const b = await gen(o.img, badge);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `YTB定制_${badge !== 'none' ? BADGE_DATA[badge].name + '_' : ''}${o.name.replace(/\.[^.]+$/, '')}.png`;
            a.click();
            $('statusText').innerText = `完成 ${(b.size/1048576).toFixed(2)}MB`;
        } catch (err) { $('statusText').innerText = '失败'; }
        finally { proc = false; render(); }
    };

    $('batchGenBtn').onclick = async () => {
        if (!list.length || proc) return;
        proc = true; $('singleGenBtn').disabled = $('batchGenBtn').disabled = true;
        $('progressWrap').style.display = 'block';
        const zip = new JSZip();
        for (let i = 0; i < list.length; i++) {
            try {
                const b = await gen(list[i].img, badge);
                zip.file(`YTB定制_${badge !== 'none' ? BADGE_DATA[badge].name + '_' : ''}${list[i].name.replace(/\.[^.]+$/, '')}.png`, b);
            } catch (err) {}
            $('progressFill').style.width = ((i + 1) / list.length * 100) + '%';
        }
        const zb = await zip.generateAsync({type: 'blob'});
        saveAs(zb, `YTB定制_${Date.now()}.zip`);
        $('progressWrap').style.display = 'none';
        $('statusText').innerText = `完成 ${list.length}张`;
        proc = false; render();
    };

    
    // 弹窗确认
    $('confirmBtn').onclick = () => {
        $('welcomePopup').style.display = 'none';
        
    let deleteTarget = null;
    $('galleryBtn').onclick = async () => { $('galleryOverlay').style.display = 'flex'; await loadGallery(); };
    $('closeGallery').onclick = () => { $('galleryOverlay').style.display = 'none'; };
    async function loadGallery() {
        $('galleryGrid').innerHTML = '<div class="gallery-empty">加载中...</div>';
        try {
            const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list('', { limit: 1000, sortBy: { column: 'created_at', order: 'desc' } });
            if (error) throw error;
            const images = data.filter(f => !f.name.startsWith('.'));
            if (images.length === 0) { $('galleryGrid').innerHTML = '<div class="gallery-empty">暂无图片</div>'; $('galleryCount').textContent = '共0张'; return; }
            $('galleryCount').textContent = '共' + images.length + '张';
            $('galleryGrid').innerHTML = images.map(img => `
                <div class="gallery-item">
                    <img src="https://crmppzkcadtlcjcidlxc.supabase.co/storage/v1/object/public/${BUCKET_NAME}/${img.name}" loading="lazy">
                    <div class="gallery-item-info">
                        <div class="gallery-item-time">${new Date(img.created_at).toLocaleString('zh-CN')}</div>
                        <div class="gallery-item-actions">
                            <button class="gallery-item-btn download-btn" onclick="downloadImg('${img.name}')">下载</button>
                            <button class="gallery-item-btn delete-btn" onclick="promptDelete('${img.name}')">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch(e) { $('galleryGrid').innerHTML = '<div class="gallery-empty">加载失败</div>'; }
    }
    window.downloadImg = async function(name) {
        const a = document.createElement('a');
        a.href = 'https://crmppzkcadtlcjcidlxc.supabase.co/storage/v1/object/public/' + BUCKET_NAME + '/' + name;
        a.download = name;
        a.click();
    }
    window.promptDelete = function(name) { deleteTarget = name; $('adminPrompt').style.display = 'block'; $('adminPassword').value = ''; $('adminPassword').focus(); }
    $('confirmAdmin').onclick = async () => {
        if ($('adminPassword').value !== ADMIN_PASSWORD) { alert('密码错误！'); return; }
        try { await supabaseClient.storage.from(BUCKET_NAME).remove([deleteTarget]); $('adminPrompt').style.display = 'none'; await loadGallery(); alert('删除成功！'); } 
        catch(e) { alert('删除失败'); }
    };
    $('adminPassword').onkeypress = e => { if (e.key === 'Enter') $('confirmAdmin').click(); };
    loadBadges(); preview();
    };
})();
</script>

        <div class="gallery-header">
            <div><span class="gallery-title">🖼️ 海报图库</span><span class="gallery-count" id="galleryCount">加载中...</span></div>
            <button class="gallery-close" id="closeGallery">返回工具</button>
        </div>
        <div class="gallery-grid" id="galleryGrid"><div class="gallery-empty">加载中...</div></div>
    </div>

        <div style="color:#fff;margin-bottom:10px;">🔐 请输入管理员密码</div>
        <input type="password" id="adminPassword" placeholder="输入密码">
        <button id="confirmAdmin">确认</button>
    </div>
